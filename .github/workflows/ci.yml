name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'

jobs:
  # Core contract testing - always runs
  contracts:
    runs-on: ubuntu-latest
    name: Smart Contracts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: 'package.json'

      - name: Install dependencies
        run: |
          yarn install
        continue-on-error: false

      - name: Compile contracts
        run: |
          if [ -f "hardhat.config.ts" ] || [ -f "hardhat.config.js" ]; then
            yarn hardhat compile
          else
            echo "No Hardhat config found, skipping compilation"
            exit 1
          fi

      - name: Run contract tests
        run: |
          if [ -d "test" ] && [ "$(ls -A test)" ]; then
            yarn test
          else
            echo "No tests found, running hardhat test"
            yarn hardhat test
          fi

      - name: Generate test coverage
        run: |
          yarn hardhat coverage || echo "Coverage generation failed, continuing..."
        continue-on-error: true

      - name: Check contract sizes
        run: |
          yarn hardhat size-contracts || echo "Contract size check failed, continuing..."
        continue-on-error: true

  # Optional: API testing (only if api/ exists)
  api:
    runs-on: ubuntu-latest
    name: API Tests
    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if API exists
        id: check-api
        run: |
          if [ -f "api/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check-api.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install API dependencies
        if: steps.check-api.outputs.exists == 'true'
        run: |
          cd api
          if [ -f "yarn.lock" ]; then
            yarn install
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi
        continue-on-error: true

      - name: Run API tests
        if: steps.check-api.outputs.exists == 'true'
        run: |
          cd api
          npm test || yarn test || echo "No test script found"
        continue-on-error: true

  # Optional: Frontend testing (only if web/ exists)
  frontend:
    runs-on: ubuntu-latest
    name: Frontend Tests
    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if Frontend exists
        id: check-frontend
        run: |
          if [ -f "web/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check-frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Frontend dependencies
        if: steps.check-frontend.outputs.exists == 'true'
        run: |
          cd web
          if [ -f "yarn.lock" ]; then
            yarn install
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi
        continue-on-error: true

      - name: Run Frontend tests
        if: steps.check-frontend.outputs.exists == 'true'
        run: |
          cd web
          npm test || yarn test || echo "No test script found"
        continue-on-error: true

      - name: Build Frontend
        if: steps.check-frontend.outputs.exists == 'true'
        run: |
          cd web
          npm run build || yarn build || echo "No build script found"
        continue-on-error: true

  # Security scan (optional, only on main branch)
  security:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: contracts
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install
        continue-on-error: true

      - name: Run npm audit
        run: |
          npm audit --audit-level moderate || echo "Audit found issues, continuing..."
        continue-on-error: true

      - name: Install Slither (if available)
        run: |
          pip3 install slither-analyzer || echo "Slither installation failed"
        continue-on-error: true

      - name: Run Slither analysis
        run: |
          if command -v slither &> /dev/null; then
            slither . --exclude-dependencies || echo "Slither analysis completed with findings"
          else
            echo "Slither not available, skipping static analysis"
          fi
        continue-on-error: true