name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18.x'
  PYTHON_VERSION: '3.9'

jobs:
  # Smart Contract Testing and Analysis
  contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Compile contracts
        run: yarn build:contracts

      - name: Run contract tests
        run: yarn test:contracts

      - name: Generate test coverage
        run: yarn test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: contracts
        continue-on-error: true

      - name: Run gas report
        run: REPORT_GAS=true yarn test:contracts

      - name: Generate TypeChain types
        run: yarn typechain

      - name: Check contract sizes
        run: yarn hardhat size-contracts
        continue-on-error: true

      - name: Setup Python for security tools
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Slither
        run: |
          python -m pip install --upgrade pip
          pip install slither-analyzer

      - name: Run Slither analysis
        run: |
          chmod +x scripts/audit/run-slither.sh
          ./scripts/audit/run-slither.sh
        continue-on-error: true

      - name: Upload Slither results
        uses: actions/upload-artifact@v4
        with:
          name: slither-results
          path: audits/slither/
          retention-days: 30

      - name: Lint Solidity
        run: yarn lint:contracts

      - name: Upload contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: |
            artifacts/
            typechain-types/
            cache/
          retention-days: 7

  # API Testing
  api:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: |
            yarn.lock
            api/yarn.lock

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install API dependencies
        run: cd api && yarn install --frozen-lockfile

      - name: Build API
        run: cd api && yarn build

      - name: Run API tests
        run: cd api && yarn test
        env:
          DATABASE_URL: mongodb://localhost:27017/test-db
          NODE_ENV: test

      - name: Run API linting
        run: cd api && yarn lint

      - name: Generate API coverage
        run: cd api && yarn test:coverage

      - name: Upload API coverage
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./api/coverage
          flags: api
        continue-on-error: true

      - name: Upload API artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-artifacts
          path: |
            api/dist/
            api/package.json
            api/yarn.lock
          retention-days: 7

  # Frontend Testing
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: |
            yarn.lock
            web/yarn.lock

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install frontend dependencies
        run: cd web && yarn install --frozen-lockfile

      - name: Run type checking
        run: cd web && yarn type-check

      - name: Run linting
        run: cd web && yarn lint

      - name: Run frontend tests
        run: cd web && yarn test
        continue-on-error: true

      - name: Build frontend
        run: cd web && yarn build
        env:
          NEXT_PUBLIC_CHAIN_ID: 1337
          NEXT_PUBLIC_RPC_URL: http://localhost:8545
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./web/coverage
          flags: frontend
        continue-on-error: true

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifacts
          path: |
            web/.next/
            web/out/
            web/package.json
            web/yarn.lock
          retention-days: 7

  # Security Scan
  security:
    runs-on: ubuntu-latest
    needs: contracts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download contract artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-artifacts

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Run npm audit
        run: |
          mkdir -p security-audit
          yarn audit --json > security-audit/audit-results.json || true
          cd api && yarn audit --json > ../security-audit/audit-results-api.json || true
          cd ../web && yarn audit --json > ../security-audit/audit-results-web.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: security-audit/
          retention-days: 30

  # Performance Tests
  performance:
    runs-on: ubuntu-latest
    needs: contracts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download contract artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-artifacts

      - name: Run gas optimization tests
        run: |
          REPORT_GAS=true yarn test:contracts
          yarn hardhat size-contracts
        continue-on-error: true

      - name: Install frontend dependencies for Lighthouse
        run: cd web && yarn install --frozen-lockfile

      - name: Build frontend for Lighthouse
        run: cd web && yarn build && yarn export
        env:
          NEXT_PUBLIC_CHAIN_ID: 1337
          NEXT_PUBLIC_RPC_URL: http://localhost:8545
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            gas-report.txt
            .lighthouseci/
          retention-days: 30

  # Integration Tests
  integration:
    runs-on: ubuntu-latest
    needs: [contracts, api]
    if: github.event_name == 'push'

    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install all dependencies
        run: |
          yarn install --frozen-lockfile
          cd api && yarn install --frozen-lockfile
          cd ../web && yarn install --frozen-lockfile

      - name: Download contract artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-artifacts

      - name: Download API artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-artifacts

      - name: Start Hardhat node
        run: |
          yarn hardhat node &
          sleep 10
        env:
          NODE_ENV: test

      - name: Deploy contracts to local network
        run: yarn deploy:local
        env:
          NODE_ENV: test

      - name: Start API server
        run: |
          cd api && yarn start &
          sleep 10
        env:
          NODE_ENV: test
          DATABASE_URL: mongodb://localhost:27017/integration-test

      - name: Run integration tests
        run: yarn test:integration
        env:
          API_URL: http://localhost:3001
          RPC_URL: http://localhost:8545
        continue-on-error: true

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            test-results/
            logs/
          retention-days: 7

  # Build and Package
  build:
    runs-on: ubuntu-latest
    needs: [contracts, api, frontend]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install all dependencies
        run: |
          yarn install --frozen-lockfile
          cd api && yarn install --frozen-lockfile
          cd ../web && yarn install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-artifacts'
          merge-multiple: true

      - name: Build all packages
        run: |
          yarn build:contracts
          cd api && yarn build
          cd ../web && yarn build

      - name: Create deployment package
        run: |
          mkdir -p dist
          cp -r artifacts dist/
          cp -r typechain-types dist/
          cp -r api/dist dist/api
          cp -r web/.next dist/web
          cp -r web/public dist/web/
          cp package.json dist/
          cp README.md dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 30

  # Deployment (only on main branch)
  deploy:
    runs-on: ubuntu-latest
    needs: [build, security, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment commands here
        env:
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add smoke test commands here

      - name: Deploy to production
        if: success()
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
        env:
          PRODUCTION_API_KEY: ${{ secrets.PRODUCTION_API_KEY }}

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()
        continue-on-error: true

  # Cleanup
  cleanup:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Clean up old artifacts
        uses: actions/github-script@v6
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const oldArtifacts = artifacts.data.artifacts.filter(artifact => {
              const now = new Date();
              const created = new Date(artifact.created_at);
              const daysDiff = (now - created) / (1000 * 60 * 60 * 24);
              return daysDiff > 30;
            });

            for (const artifact of oldArtifacts) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                console.log(`Deleted artifact: ${artifact.name}`);
              } catch (error) {
                console.log(`Failed to delete artifact: ${artifact.name}`);
              }
            }